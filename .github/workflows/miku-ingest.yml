name: MIKU knowledge ingest

# Rebuilds MIKU's knowledge index. Trigger it from the "Build knowledge"
# button in your WPCodingPress dashboard, or by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Re-crawl every page (ignore the change cache)"
        type: boolean
        default: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Build the MIKU index
        run: npx miku ingest${{ inputs.force && ' --force' || '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MIKU_DB_URL: ${{ secrets.MIKU_DB_URL }}
          MIKU_DB_HOST: ${{ secrets.MIKU_DB_HOST }}
          MIKU_DB_PORT: ${{ secrets.MIKU_DB_PORT }}
          MIKU_DB_USER: ${{ secrets.MIKU_DB_USER }}
          MIKU_DB_PASSWORD: ${{ secrets.MIKU_DB_PASSWORD }}
          MIKU_DB_NAME: ${{ secrets.MIKU_DB_NAME }}
          MIKU_DB_SSL: ${{ secrets.MIKU_DB_SSL }}
